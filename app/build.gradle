plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.momobypass' // 使用你成功案例的包名
    compileSdk 34

    defaultConfig {
        applicationId "com.example.momobypass"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fvisibility=hidden -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 沿用你成功案例的配置
    compileOnly 'de.robv.android.xposed:api:82'
}
