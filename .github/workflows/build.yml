name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    # ✅ 核心：直接下载 Xposed API 82 jar 放到 libs 目录下，解决找不到依赖的问题
    - name: Download Xposed API
      run: |
        mkdir -p app/libs
        wget -O app/libs/api-82.jar https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        ndk-version: '26.1.10909125'
        cmake-version: '3.22.1'

    - name: Build APK
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MockDevice-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
